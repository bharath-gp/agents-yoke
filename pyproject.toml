[project]
name = "yoke"
version = "0.8.0"
description = "Primary/secondary agent loop: Claude plans and validates, agy codes."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
yoke = "yoke.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yoke"]

[tool.setuptools.package-data]
yoke = ["defaults.json", "schemas/*.json", "prompts/*.md", "githooks/*", "dashboard.html"]
