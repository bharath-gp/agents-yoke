[project]
name = "agyloop"
version = "0.1.0"
description = "Primary/secondary agent loop: Claude plans and validates, agy codes."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agyloop = "agyloop.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agyloop"]
