[project]
name = "yoke"
version = "0.20.1"
description = "Primary/secondary agent loop: Claude plans and validates, agy codes."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
e2e = ["playwright>=1.40"]

[project.scripts]
yoke = "yoke.cli:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yoke"]

[tool.setuptools.package-data]
yoke = ["defaults.json", "schemas/*.json", "prompts/*.md", "standards/*.md", "githooks/*", "dashboard.html"]
