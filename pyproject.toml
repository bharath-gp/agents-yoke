[project]
name = "yoke"
version = "0.15.0"
description = "Primary/secondary agent loop: Claude plans and validates, agy codes."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
e2e = ["playwright>=1.64.1"]

[project.scripts]
yoke = "yoke.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yoke"]

[tool.setuptools.package-data]
yoke = ["defaults.json", "schemas/*.json", "prompts/*.md", "githooks/*", "dashboard.html"]
