name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:   # keep in sync with the ruleset's required check
    runs-on: ubuntu-24.04   # setup-python has no 3.9 build for ubuntu-latest (26.04); floor is 3.9.6
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s tests
